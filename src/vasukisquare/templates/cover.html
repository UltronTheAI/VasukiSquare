<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ plan.title }} - Cover</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1600px;
      height: 2560px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: {{ plan.background_color or "#001e2b" }};
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .cover-canvas {
      position: relative;
      width: 1600px;
      height: 2560px;
      overflow: hidden;
      background-color: {{ plan.background_color or "#001e2b" }};
      display: flex;
      flex-direction: column;
    }

    /* Safe Content Area for physical A4 crop (200px top/bottom, 180px left/right) */
    .safe-content-area {
      position: absolute;
      top: 220px;
      bottom: 220px;
      left: 180px;
      right: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover-brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .cover-brand-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: {{ plan.accent_color or "#00ed64" }};
    }

    .cover-category-badge {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #a8b3bc;
    }

    .cover-main-body {
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .cover-icon-wrapper {
      margin-bottom: 20px;
    }

    .cover-icon-wrapper svg {
      width: 80px;
      height: 80px;
      stroke-width: 1.75;
    }

    .cover-title {
      font-size: 92px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -2px;
      color: #ffffff;
      max-width: 1200px;
      word-break: break-word;
    }

    .cover-subtitle {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.40;
      color: #c1ccd6;
      max-width: 1100px;
      word-break: break-word;
    }

    .cover-divider {
      width: 120px;
      height: 4px;
      background-color: {{ plan.accent_color or "#00ed64" }};
      margin: 10px 0;
    }

    .cover-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 20px;
      color: #a8b3bc;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .cover-footer-left {
      color: #e1e5e8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="cover-canvas">
    <div class="safe-content-area">
      <div class="cover-brand-header">
        <span class="cover-brand-label">VASUKISQUARE</span>
        <span class="cover-category-badge">{{ plan.category }}</span>
      </div>

      <div class="cover-main-body">
        {% if hero_icon_svg %}
        <div class="cover-icon-wrapper">
          {{ hero_icon_svg | safe }}
        </div>
        {% endif %}

        <div class="cover-divider"></div>

        <h1 class="cover-title">{{ plan.title }}</h1>
        {% if plan.subtitle %}
        <p class="cover-subtitle">{{ plan.subtitle }}</p>
        {% endif %}
      </div>

      <footer class="cover-footer">
        <span class="cover-footer-left">{{ plan.author }}</span>
        <span>VASUKISQUARE TECHNICAL PUBLISHING · FIRST EDITION</span>
      </footer>
    </div>
  </div>
</body>
</html>
