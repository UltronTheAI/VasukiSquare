<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ plan.title }} - Cover</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1600px;
      height: 2560px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: {{ plan.background_color }};
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .cover-canvas {
      position: relative;
      width: 1600px;
      height: 2560px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, rgba(0, 237, 100, 0.08) 0%, transparent 70%),
                  linear-gradient(180deg, {{ plan.background_color }} 0%, #00121a 100%);
    }

    .svg-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 1600px;
      height: 2560px;
      z-index: 1;
      pointer-events: none;
    }

    /* Safe Content Area (Guaranteed within physical A4 crop) */
    .safe-content-area {
      position: absolute;
      top: 200px;
      bottom: 200px;
      left: 180px;
      right: 180px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 12px 28px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: {{ plan.accent_color }};
      align-self: flex-start;
    }

    .hero-center-graphic {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 60px 0;
    }

    .hero-icon-container {
      width: 220px;
      height: 220px;
      border-radius: 48px;
      background: rgba(0, 30, 43, 0.7);
      border: 2px solid {{ plan.accent_color }};
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }

    .cover-typography {
      margin-top: auto;
      margin-bottom: 80px;
    }

    .cover-title {
      font-size: 88px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -2px;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .cover-subtitle {
      font-size: 34px;
      font-weight: 400;
      line-height: 1.35;
      color: #a8b3bc;
      max-width: 1200px;
    }

    .cover-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 36px;
      border-top: 2px solid rgba(255, 255, 255, 0.12);
      font-size: 24px;
      color: #a8b3bc;
      font-weight: 500;
    }

    .brand-signature {
      color: {{ plan.accent_color }};
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="cover-canvas">
    <svg class="svg-background" viewBox="0 0 1600 2560" xmlns="http://www.w3.org/2000/svg">
      {{ geometric_svg | safe }}
    </svg>

    <div class="safe-content-area">
      <div class="cover-top-badge">
        <span>{{ plan.category }}</span>
      </div>

      <div class="hero-center-graphic">
        <div class="hero-icon-container">
          {{ hero_icon_svg | safe }}
        </div>
      </div>

      <div class="cover-typography">
        <h1 class="cover-title">{{ plan.title }}</h1>
        {% if plan.subtitle %}
        <p class="cover-subtitle">{{ plan.subtitle }}</p>
        {% endif %}
      </div>

      <footer class="cover-footer">
        <span>{{ plan.author }}</span>
        <span class="brand-signature">VASUKISQUARE</span>
      </footer>
    </div>
  </div>
</body>
</html>
