name: Vasuki Daily Promotion

on:
  schedule:
    # Run daily at 04:37 UTC (10:07 IST / Asia/Kolkata / 00:37 EDT / 21:37 PDT prev day)
    # Using a non-round minute (37) to avoid GitHub Actions schedule congestion
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate campaign without publishing (safe mode)'
        required: true
        default: true
        type: boolean
      count:
        description: 'Number of eligible ebooks to select and promote'
        required: false
        default: '3'
        type: string
      book:
        description: 'Optional specific book ID or slug to target'
        required: false
        default: ''
        type: string
      verbose:
        description: 'Enable verbose debug logging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vasuki-daily-promotion
  cancel-in-progress: false

jobs:
  daily-promotion:
    name: Execute Daily Promotion Campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || vars.MONGODB_DATABASE || 'vasukisquare' }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      PUBLICATION_BASE_URL: ${{ vars.PUBLICATION_BASE_URL || 'https://vasukisquare.cc' }}
      PROMOTION_PLATFORM: devto
      PROMOTION_BOOK_COOLDOWN_HOURS: '72'
      PROMOTION_POSTS_PER_RUN: ${{ inputs.count || '3' }}
      DEVTO_PUBLISH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lightweight package validation
        run: |
          python -c "import vasukisquare; print(f'VasukiSquare v{vasukisquare.__version__} loaded successfully')"
          python -c "from vasukisquare.promotion.service import PromotionService; print('PromotionService loaded successfully')"

      - name: Execute automated ebook promotion
        run: |
          mkdir -p artifacts
          
          ARGS="--count ${{ inputs.count || '3' }} --platform devto --export-json artifacts/promotion_summary.json"
          
          if [ -n "${{ inputs.book }}" ]; then
            ARGS="$ARGS --book '${{ inputs.book }}'"
          fi
          
          # Scheduled runs always publish live. Manual dispatch uses the dry_run input (default: true).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          fi
          
          if [ "${{ inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          
          echo "Executing: python scripts/promotion.py $ARGS"
          python scripts/promotion.py $ARGS

      - name: Upload promotion summary JSON artifact
        if: always() && hashFiles('artifacts/promotion_summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: promotion-summary-${{ github.run_id }}
          path: artifacts/promotion_summary.json
          retention-days: 30

